<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" width="1300" height="780" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fraud Defence Workbench architecture</title><desc id="d">Raw claim files land in a Unity Catalog volume. A Lakeflow pipeline builds bronze, silver and gold tables. A detection engine with SSCD and vision models adds verdicts that the gold tables join. Gold data is served through Lakebase and Genie to a Databricks app used by investigators and managers. Unity Catalog governs everything.</desc>
<defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33507A"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A4A1A"/></marker></defs>
